name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建前端
        run: npm ci && npm run build
        working-directory: frontend

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller opencv-python numpy pywebview

      - name: 打包与组装
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # PyInstaller 把 INFO 日志写 stderr；pwsh 会把它当致命错误，这里显式关掉
          $PSNativeCommandUseErrorActionPreference = $false
          # PyInstaller 产物偶发被 Defender 误报，先排除工作目录
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          python packaging/build_release.py $ver --ci 2>&1 | Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) { Get-Content build_log.txt -Tail 40; exit 1 }
          Get-ChildItem build_release/*.zip | ForEach-Object { Write-Output "ZIP=$($_.FullName)" }

      - name: 编译安装包（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build_release\installer.iss
          Get-ChildItem build_release/*.exe | ForEach-Object { Write-Output "SETUP=$($_.FullName)" }

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_release/Coyote-in-Cradle-v*.zip
            build_release/Coyote-in-Cradle-setup-v*.exe
          generate_release_notes: true
          overwrite: true
